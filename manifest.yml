# Paste this at https://api.slack.com/apps → Create New App → From a manifest
display_information:
  name: slackline
  description: Turns requests into Linear tickets, then does the work.
features:
  bot_user:
    display_name: slackline
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
